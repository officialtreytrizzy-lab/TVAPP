name: Deploy Trizzy Audio ACE Workers

on:
  push:
    branches:
      - main
    paths:
      - "audio-worker/**"
      - ".github/workflows/deploy-trizzy-audio-modal.yml"
  workflow_dispatch:

concurrency:
  group: trizzy-audio-ace-production
  cancel-in-progress: true

env:
  MODAL_EXPECTED_WORKSPACE: officialtreytrizzy-lab

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: python -m pip install --quiet --upgrade modal

      - name: Validate Modal deployment credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          test -n "$MODAL_TOKEN_ID" || (echo "Missing repository secret MODAL_TOKEN_ID" && exit 1)
          test -n "$MODAL_TOKEN_SECRET" || (echo "Missing repository secret MODAL_TOKEN_SECRET" && exit 1)
          output="$(modal token info 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq "^Workspace: ${MODAL_EXPECTED_WORKSPACE}( |$)" || {
            echo "Refusing deployment: expected workspace ${MODAL_EXPECTED_WORKSPACE}."
            exit 1
          }

      - name: Warm persistent ACE model volume
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal run audio-worker/modal_app.py::warm_models
          echo "Top-level model volume contents:"
          modal volume ls trizzy-audio-ace-models /

      - name: Deploy authenticated Turbo and Base ACE APIs
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy audio-worker/modal_app.py

      - name: Verify Turbo and Base model readiness
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          check_ready() {
            local name="$1"
            local url="$2"
            local body="/tmp/${name}-ready.json"

            for attempt in $(seq 1 60); do
              code="$(curl -sS -o "$body" -w "%{http_code}" --max-time 20 "$url/ready" || true)"
              if [ "$code" = "200" ]; then
                echo "$name is ready"
                cat "$body"
                return 0
              fi

              echo "$name readiness attempt $attempt/60 returned HTTP ${code:-none}"
              if [ $((attempt % 5)) -eq 0 ]; then
                cat "$body" 2>/dev/null || true
              fi
              sleep 10
            done

            echo "$name did not become ready"
            cat "$body" 2>/dev/null || true
            return 1
          }

          check_ready "turbo" "https://officialtreytrizzy-lab--trizzy-audio-ace-turbo-api.modal.run" &
          turbo_pid=$!
          check_ready "base" "https://officialtreytrizzy-lab--trizzy-audio-ace-base-api.modal.run" &
          base_pid=$!

          turbo_status=0
          base_status=0

          wait "$turbo_pid" || turbo_status=$?
          wait "$base_pid" || base_status=$?

          if [ "$turbo_status" -ne 0 ] || [ "$base_status" -ne 0 ]; then
            echo "ACE readiness failed: turbo=$turbo_status base=$base_status"
            echo "Recent Modal application logs:"
            modal app logs trizzy-audio-ace --tail 500 --timestamps || true
            exit 1
          fi
