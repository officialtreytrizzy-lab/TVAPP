name: TreyGPT OAuth Redirect Diagnostic

on:
  push:
    paths:
      - '.github/workflows/treygpt-oauth-redirect-diagnostic.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect old and new Google OAuth redirects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse
          targets = {
            'old': 'https://trevontejearl-svg--trey-gpt-trey-gpt.modal.run/api/auth/google/start?surface=https%3A%2F%2Ftreygpt-web.vercel.app',
            'new': 'https://treytrizzyofficial--trey-gpt-trey-gpt.modal.run/api/auth/google/start?surface=https%3A%2F%2Ftreygpt-web.vercel.app',
          }
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          for label, url in targets.items():
              try:
                  r = opener.open(url, timeout=20)
                  status = r.status
                  loc = r.headers.get('Location','')
              except urllib.error.HTTPError as e:
                  status = e.code
                  loc = e.headers.get('Location','')
                  body = e.read(500).decode('utf-8','replace')
              print(f'{label.upper()}_STATUS={status}')
              if loc:
                  p = urllib.parse.urlparse(loc)
                  q = urllib.parse.parse_qs(p.query)
                  print(f'{label.upper()}_LOCATION_HOST={p.netloc}')
                  print(f'{label.upper()}_REDIRECT_URI={q.get("redirect_uri", [""])[0]}')
                  print(f'{label.upper()}_HAS_CLIENT_ID={bool(q.get("client_id", [""])[0])}')
                  print(f'{label.upper()}_RESPONSE_TYPE={q.get("response_type", [""])[0]}')
              else:
                  print(f'{label.upper()}_NO_LOCATION=1')
          PY
