name: TreyGPT OAuth State Diagnostic

on:
  push:
    paths:
      - '.github/workflows/treygpt-oauth-state-diagnostic.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect old callback handoff without authenticating
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          op=urllib.request.build_opener(NoRedirect)
          start='https://trevontejearl-svg--trey-gpt-trey-gpt.modal.run/api/auth/google/start?surface=vercel'
          try: op.open(start,timeout=20)
          except urllib.error.HTTPError as e:
              loc=e.headers.get('Location','')
          q=urllib.parse.parse_qs(urllib.parse.urlparse(loc).query)
          state=q.get('state',[''])[0]
          print('START_HAS_STATE='+str(bool(state)))
          cb='https://trevontejearl-svg--trey-gpt-trey-gpt.modal.run/api/auth/google/callback?'+urllib.parse.urlencode({'error':'access_denied','state':state})
          try:
              r=op.open(cb,timeout=20); status=r.status; h=r.headers
          except urllib.error.HTTPError as e:
              status=e.code; h=e.headers
          out=h.get('Location','')
          p=urllib.parse.urlparse(out)
          print('CALLBACK_STATUS='+str(status))
          print('CALLBACK_LOCATION_HOST='+p.netloc)
          print('CALLBACK_LOCATION_PATH='+p.path)
          print('CALLBACK_QUERY_KEYS='+','.join(sorted(urllib.parse.parse_qs(p.query,keep_blank_values=True).keys())))
          print('SET_COOKIE_NAMES='+','.join(sorted({x.split('=',1)[0].strip() for x in h.get_all('Set-Cookie',[]) if '=' in x})))
          PY
